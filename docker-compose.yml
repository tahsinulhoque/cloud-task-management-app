services:
  mysql:
    image: mysql:8.0
    container_name: task-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: task_management_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: task-management-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: cloud-task-db.c3umgg80opzf.us-west-2.rds.amazonaws.com
      DB_PORT: 3306
      DB_NAME: task_management_db
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    container_name: task-management-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
